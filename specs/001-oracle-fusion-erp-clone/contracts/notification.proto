syntax = "proto3";
package fusion.notification.v1;
option go_package = "github.com/fusion/notification/v1";

// Notification Service — in-app notifications (polling-based)
// Consumed by: API gateway, all services (send notifications)

service NotificationService {
  rpc CreateNotification(CreateNotificationRequest) returns (Notification);
  rpc GetNotifications(GetNotificationsRequest) returns (GetNotificationsResponse);
  rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse);
  rpc MarkAllAsRead(MarkAllAsReadRequest) returns (MarkAllAsReadResponse);
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse);

  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Ready(ReadyRequest) returns (ReadyResponse);
}

// --- Messages ---

message CreateNotificationRequest {
  string recipient_user_id = 1;
  string type = 2;             // approval, system, alert, budget_variance
  string title = 3;
  string body = 4;
  optional string reference_entity_type = 5;
  optional string reference_entity_id = 6;
}

message GetNotificationsRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional bool unread_only = 3;
  optional string type = 4;
}

message GetNotificationsResponse {
  repeated Notification notifications = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message MarkAsReadRequest {
  string notification_id = 1;
}

message MarkAsReadResponse {}

message MarkAllAsReadRequest {}

message MarkAllAsReadResponse {
  int32 marked_count = 1;
}

message GetUnreadCountRequest {}

message GetUnreadCountResponse {
  int32 count = 1;
}

message HealthRequest {}
message HealthResponse { string status = 1; }
message ReadyRequest {}
message ReadyResponse { bool ready = 1; repeated string checks = 2; }

// --- Domain models ---

message Notification {
  string id = 1;
  string recipient_user_id = 2;
  string type = 3;
  string title = 4;
  string body = 5;
  optional string reference_entity_type = 6;
  optional string reference_entity_id = 7;
  bool is_read = 8;
  optional int64 read_at_unix = 9;
  int64 created_at_unix = 10;
}
