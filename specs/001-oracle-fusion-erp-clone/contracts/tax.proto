syntax = "proto3";
package fusion.tax.v1;
option go_package = "github.com/fusion/tax/v1";

// Tax Service — tax rates, tax calculation, tax reports
// Consumed by: API gateway, AP service, AR service (tax calculation)

service TaxService {
  rpc CreateTaxCode(CreateTaxCodeRequest) returns (TaxCode);
  rpc GetTaxCode(GetTaxCodeRequest) returns (TaxCode);
  rpc ListTaxCodes(ListTaxCodesRequest) returns (ListTaxCodesResponse);
  rpc UpdateTaxCode(UpdateTaxCodeRequest) returns (TaxCode);

  rpc CalculateTax(CalculateTaxRequest) returns (CalculateTaxResponse);
  rpc GetTaxReport(GetTaxReportRequest) returns (GetTaxReportResponse);

  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Ready(ReadyRequest) returns (ReadyResponse);
}

// --- Messages ---

message CreateTaxCodeRequest {
  string code = 1;
  string name = 2;
  string jurisdiction = 3;
  Decimal rate_percentage = 4;
  string effective_from = 5;
  optional string effective_to = 6;
  string tax_category = 7;
}

message GetTaxCodeRequest { string id = 1; }

message ListTaxCodesRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string jurisdiction = 3;
  optional string tax_category = 4;
  optional bool is_active = 5;
}

message ListTaxCodesResponse {
  repeated TaxCode tax_codes = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateTaxCodeRequest {
  string id = 1;
  optional string name = 2;
  optional Decimal rate_percentage = 3;
  optional string effective_to = 4;
  optional bool is_active = 5;
  int32 version = 6;
}

message CalculateTaxRequest {
  string tax_code_id = 1;
  Decimal taxable_amount = 2;
  string transaction_date = 3;
}

message CalculateTaxResponse {
  Decimal tax_amount = 1;
  Decimal rate_used = 2;
  string tax_code_id = 3;
}

message GetTaxReportRequest {
  string period_id = 1;
  optional string jurisdiction = 2;
  optional string tax_category = 3;
}

message GetTaxReportResponse {
  repeated TaxReportLine lines = 1;
  Decimal total_tax_collected = 2;
  Decimal total_tax_owed = 3;
  string period_name = 4;
}

message TaxReportLine {
  string tax_code = 1;
  string jurisdiction = 2;
  Decimal taxable_amount = 3;
  Decimal tax_amount = 4;
  Decimal rate_percentage = 5;
  int32 transaction_count = 6;
}

message HealthRequest {}
message HealthResponse { string status = 1; }
message ReadyRequest {}
message ReadyResponse { bool ready = 1; repeated string checks = 2; }

// --- Domain models ---

message TaxCode {
  string id = 1;
  string code = 2;
  string name = 3;
  string jurisdiction = 4;
  Decimal rate_percentage = 5;
  string effective_from = 6;
  optional string effective_to = 7;
  string tax_category = 8;
  bool is_active = 9;
  int32 version = 10;
  int64 created_at_unix = 11;
  int64 updated_at_unix = 12;
}

message Decimal {
  int64 units = 1;
  int32 nanos = 2;
}
