syntax = "proto3";
package fusion.procurement.v1;
option go_package = "github.com/fusion/procurement/v1";

// Procurement Service — requisitions, purchase orders, goods receipts
// Consumed by: API gateway, AP service (three-way matching)

service ProcurementService {
  // Requisitions
  rpc CreateRequisition(CreateRequisitionRequest) returns (Requisition);
  rpc GetRequisition(GetRequisitionRequest) returns (Requisition);
  rpc ListRequisitions(ListRequisitionsRequest) returns (ListRequisitionsResponse);
  rpc UpdateRequisition(UpdateRequisitionRequest) returns (Requisition);
  rpc SubmitRequisition(SubmitRequisitionRequest) returns (Requisition);
  rpc ApproveRequisition(ApproveRequisitionRequest) returns (Requisition);
  rpc RejectRequisition(RejectRequisitionRequest) returns (Requisition);

  // Purchase Orders
  rpc CreatePurchaseOrder(CreatePurchaseOrderRequest) returns (PurchaseOrder);
  rpc GetPurchaseOrder(GetPurchaseOrderRequest) returns (PurchaseOrder);
  rpc ListPurchaseOrders(ListPurchaseOrdersRequest) returns (ListPurchaseOrdersResponse);
  rpc UpdatePurchaseOrder(UpdatePurchaseOrderRequest) returns (PurchaseOrder);

  // Goods Receipts
  rpc CreateGoodsReceipt(CreateGoodsReceiptRequest) returns (GoodsReceipt);
  rpc GetGoodsReceipt(GetGoodsReceiptRequest) returns (GoodsReceipt);
  rpc ListGoodsReceipts(ListGoodsReceiptsRequest) returns (ListGoodsReceiptsResponse);

  // Health
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Ready(ReadyRequest) returns (ReadyResponse);
}

// --- Messages ---

message CreateRequisitionRequest {
  optional string description = 1;
  repeated RequisitionLine lines = 2;
}

message GetRequisitionRequest { string id = 1; }

message ListRequisitionsRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string status = 3;
  optional string requester_id = 4;
}

message ListRequisitionsResponse {
  repeated Requisition requisitions = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateRequisitionRequest {
  string id = 1;
  optional string description = 2;
  repeated RequisitionLine lines = 3;
  int32 version = 4;
}

message SubmitRequisitionRequest { string id = 1; int32 version = 2; }

message ApproveRequisitionRequest {
  string id = 1;
  optional string comments = 2;
}

message RejectRequisitionRequest {
  string id = 1;
  string reason = 2;
}

message CreatePurchaseOrderRequest {
  optional string requisition_id = 1;
  string vendor_id = 2;
  string order_date = 3;
  optional string delivery_date = 4;
  optional string description = 5;
  string currency = 6;
  repeated PurchaseOrderLine lines = 7;
}

message GetPurchaseOrderRequest { string id = 1; }

message ListPurchaseOrdersRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string status = 3;
  optional string vendor_id = 4;
}

message ListPurchaseOrdersResponse {
  repeated PurchaseOrder orders = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdatePurchaseOrderRequest {
  string id = 1;
  optional string delivery_date = 2;
  repeated PurchaseOrderLine lines = 3;
  int32 version = 4;
}

message CreateGoodsReceiptRequest {
  string po_id = 1;
  string received_date = 2;
  repeated GoodsReceiptLineInput lines = 3;
}

message GoodsReceiptLineInput {
  string po_line_id = 1;
  Decimal quantity_received = 2;
  optional string notes = 3;
}

message GetGoodsReceiptRequest { string id = 1; }

message ListGoodsReceiptsRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string po_id = 3;
}

message ListGoodsReceiptsResponse {
  repeated GoodsReceipt receipts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message HealthRequest {}
message HealthResponse { string status = 1; }
message ReadyRequest {}
message ReadyResponse { bool ready = 1; repeated string checks = 2; }

// --- Domain models ---

message Requisition {
  string id = 1;
  string requisition_number = 2;
  string requester_id = 3;
  optional string description = 4;
  string status = 5;
  Decimal total_estimated_cost = 6;
  repeated RequisitionLine lines = 7;
  int32 version = 8;
  int64 created_at_unix = 9;
  int64 updated_at_unix = 10;
}

message RequisitionLine {
  string id = 1;
  int32 line_number = 2;
  string item_description = 3;
  Decimal quantity = 4;
  string unit_of_measure = 5;
  Decimal estimated_unit_price = 6;
  optional string category = 7;
}

message PurchaseOrder {
  string id = 1;
  string po_number = 2;
  optional string requisition_id = 3;
  string vendor_id = 4;
  string order_date = 5;
  optional string delivery_date = 6;
  optional string description = 7;
  string status = 8;
  Decimal total_amount = 9;
  string currency = 10;
  repeated PurchaseOrderLine lines = 11;
  int32 version = 12;
  int64 created_at_unix = 13;
  int64 updated_at_unix = 14;
}

message PurchaseOrderLine {
  string id = 1;
  int32 line_number = 2;
  string item_description = 3;
  Decimal quantity_ordered = 4;
  Decimal quantity_received = 5;
  Decimal unit_price = 6;
  Decimal line_amount = 7;
  optional string delivery_date = 8;
  string status = 9;
}

message GoodsReceipt {
  string id = 1;
  string receipt_number = 2;
  string po_id = 3;
  string received_date = 4;
  string received_by = 5;
  string status = 6;
  repeated GoodsReceiptLine lines = 7;
  int32 version = 8;
  int64 created_at_unix = 9;
  int64 updated_at_unix = 10;
}

message GoodsReceiptLine {
  string id = 1;
  string po_line_id = 2;
  Decimal quantity_received = 3;
  optional string notes = 4;
}

message Decimal {
  int64 units = 1;
  int32 nanos = 2;
}
