syntax = "proto3";
package fusion.budget.v1;
option go_package = "github.com/fusion/budget/v1";

// Budget Service — budget creation, tracking, variance analysis
// Consumed by: API gateway, reporting service

service BudgetService {
  rpc CreateBudget(CreateBudgetRequest) returns (Budget);
  rpc GetBudget(GetBudgetRequest) returns (Budget);
  rpc ListBudgets(ListBudgetsRequest) returns (ListBudgetsResponse);
  rpc UpdateBudget(UpdateBudgetRequest) returns (Budget);
  rpc SubmitBudgetForApproval(SubmitBudgetForApprovalRequest) returns (Budget);
  rpc ApproveBudget(ApproveBudgetRequest) returns (Budget);

  rpc GetBudgetVsActual(GetBudgetVsActualRequest) returns (BudgetVsActualResponse);
  rpc GetVarianceAlerts(GetVarianceAlertsRequest) returns (GetVarianceAlertsResponse);
  rpc AcknowledgeVarianceAlert(AcknowledgeVarianceAlertRequest) returns (VarianceAlert);

  // CSV/Excel import
  rpc ImportBudgetLines(ImportBudgetLinesRequest) returns (ImportBudgetLinesResponse);

  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Ready(ReadyRequest) returns (ReadyResponse);
}

// --- Messages ---

message CreateBudgetRequest {
  string name = 1;
  int32 fiscal_year = 2;
  optional string description = 3;
  repeated BudgetLineInput lines = 4;
}

message BudgetLineInput {
  string account_id = 1;
  optional string department_id = 2;
  string period_amounts_json = 3;  // {"01": "10000.00", ...}
  optional Decimal variance_threshold_pct = 4;
}

message GetBudgetRequest { string id = 1; }

message ListBudgetsRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string status = 3;
  optional int32 fiscal_year = 4;
}

message ListBudgetsResponse {
  repeated Budget budgets = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateBudgetRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  repeated BudgetLineInput lines = 4;
  int32 version = 5;
}

message SubmitBudgetForApprovalRequest { string id = 1; int32 version = 2; }
message ApproveBudgetRequest { string id = 1; optional string comments = 2; }

message GetBudgetVsActualRequest {
  string budget_id = 1;
  optional string period = 2;  // "YYYY-MM" or omit for full year
}

message BudgetVsActualResponse {
  repeated BudgetVsActualLine lines = 1;
  Decimal total_budget = 2;
  Decimal total_actual = 3;
  Decimal total_variance = 4;
}

message BudgetVsActualLine {
  string account_id = 1;
  string account_code = 2;
  string account_name = 3;
  Decimal budgeted = 4;
  Decimal actual = 5;
  Decimal variance = 6;
  Decimal variance_pct = 7;
}

message GetVarianceAlertsRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional bool acknowledged = 3;
}

message GetVarianceAlertsResponse {
  repeated VarianceAlert alerts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message AcknowledgeVarianceAlertRequest { string id = 1; }

message ImportBudgetLinesRequest {
  string budget_id = 1;
  bytes file_data = 2;
  string file_format = 3;  // "csv" or "xlsx"
}

message ImportBudgetLinesResponse {
  int32 lines_imported = 1;
  int32 lines_skipped = 2;
  repeated string errors = 3;
}

message HealthRequest {}
message HealthResponse { string status = 1; }
message ReadyRequest {}
message ReadyResponse { bool ready = 1; repeated string checks = 2; }

// --- Domain models ---

message Budget {
  string id = 1;
  string name = 2;
  int32 fiscal_year = 3;
  optional string description = 4;
  string status = 5;
  Decimal total_budget = 6;
  repeated BudgetLine lines = 7;
  int32 version = 8;
  int64 created_at_unix = 9;
  int64 updated_at_unix = 10;
}

message BudgetLine {
  string id = 1;
  string account_id = 2;
  optional string department_id = 3;
  string period_amounts_json = 4;
  Decimal total_amount = 5;
  Decimal variance_threshold_pct = 6;
}

message VarianceAlert {
  string id = 1;
  string budget_line_id = 2;
  string period = 3;
  Decimal budgeted_amount = 4;
  Decimal actual_amount = 5;
  Decimal variance_amount = 6;
  Decimal variance_pct = 7;
  string alert_type = 8;
  optional string acknowledged_by = 9;
  int64 acknowledged_at_unix = 10;
  int64 created_at_unix = 11;
}

message Decimal {
  int64 units = 1;
  int32 nanos = 2;
}
