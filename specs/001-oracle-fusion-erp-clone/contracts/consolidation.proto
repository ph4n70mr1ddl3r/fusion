syntax = "proto3";
package fusion.consolidation.v1;
option go_package = "github.com/fusion/consolidation/v1";

// Consolidation Service — legal entities, exchange rates, consolidation runs
// Consumed by: API gateway, GL service (period close), reporting service

service ConsolidationService {
  // Legal entities
  rpc CreateLegalEntity(CreateLegalEntityRequest) returns (LegalEntity);
  rpc GetLegalEntity(GetLegalEntityRequest) returns (LegalEntity);
  rpc ListLegalEntities(ListLegalEntitiesRequest) returns (ListLegalEntitiesResponse);
  rpc UpdateLegalEntity(UpdateLegalEntityRequest) returns (LegalEntity);

  // Exchange rates
  rpc CreateExchangeRate(CreateExchangeRateRequest) returns (ExchangeRate);
  rpc GetExchangeRate(GetExchangeRateRequest) returns (ExchangeRate);
  rpc ListExchangeRates(ListExchangeRatesRequest) returns (ListExchangeRatesResponse);
  rpc DeleteExchangeRate(DeleteExchangeRateRequest) returns (DeleteExchangeRateResponse);

  // Currency revaluation
  rpc RunCurrencyRevaluation(RunCurrencyRevaluationRequest) returns (RunCurrencyRevaluationResponse);

  // Consolidation
  rpc RunConsolidation(RunConsolidationRequest) returns (ConsolidationRun);
  rpc GetConsolidationRun(GetConsolidationRunRequest) returns (ConsolidationRun);
  rpc ListConsolidationRuns(ListConsolidationRunsRequest) returns (ListConsolidationRunsResponse);

  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Ready(ReadyRequest) returns (ReadyResponse);
}

// --- Messages ---

message CreateLegalEntityRequest {
  string entity_code = 1;
  string name = 2;
  string base_currency = 3;
  optional string parent_entity_id = 4;
  int32 fiscal_year_start_month = 5;
  bool is_consolidating = 6;
}

message GetLegalEntityRequest { string id = 1; }

message ListLegalEntitiesRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string status = 3;
}

message ListLegalEntitiesResponse {
  repeated LegalEntity entities = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateLegalEntityRequest {
  string id = 1;
  optional string name = 2;
  optional string base_currency = 3;
  int32 version = 4;
}

message CreateExchangeRateRequest {
  string from_currency = 1;
  string to_currency = 2;
  Decimal rate = 3;
  string effective_date = 4;
}

message GetExchangeRateRequest { string id = 1; }

message ListExchangeRatesRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string from_currency = 3;
  optional string to_currency = 4;
  optional string effective_date = 5;
}

message ListExchangeRatesResponse {
  repeated ExchangeRate rates = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message DeleteExchangeRateRequest { string id = 1; }
message DeleteExchangeRateResponse {}

message RunCurrencyRevaluationRequest {
  string legal_entity_id = 1;
  string period_id = 2;
}

message RunCurrencyRevaluationResponse {
  string journal_entry_id = 1;
  Decimal total_unrealized_gain = 2;
  Decimal total_unrealized_loss = 3;
  int32 accounts_revalued = 4;
}

message RunConsolidationRequest {
  string parent_entity_id = 1;
  string reporting_period_id = 2;
  repeated string subsidiary_entity_ids = 3;
}

message GetConsolidationRunRequest { string id = 1; }

message ListConsolidationRunsRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string parent_entity_id = 3;
  optional string status = 4;
}

message ListConsolidationRunsResponse {
  repeated ConsolidationRun runs = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message HealthRequest {}
message HealthResponse { string status = 1; }
message ReadyRequest {}
message ReadyResponse { bool ready = 1; repeated string checks = 2; }

// --- Domain models ---

message LegalEntity {
  string id = 1;
  string entity_code = 2;
  string name = 3;
  string base_currency = 4;
  optional string parent_entity_id = 5;
  int32 fiscal_year_start_month = 6;
  bool is_consolidating = 7;
  string status = 8;
  int64 created_at_unix = 9;
  int64 updated_at_unix = 10;
}

message ExchangeRate {
  string id = 1;
  string from_currency = 2;
  string to_currency = 3;
  Decimal rate = 4;
  string effective_date = 5;
  int64 created_at_unix = 6;
}

message ConsolidationRun {
  string id = 1;
  string parent_entity_id = 2;
  string reporting_period_id = 3;
  string status = 4;
  optional string exchange_rates_used_json = 5;
  optional string eliminations_applied_json = 6;
  optional Decimal total_eliminations = 7;
  optional int64 started_at_unix = 8;
  optional int64 completed_at_unix = 9;
  optional string error_message = 10;
  int64 created_at_unix = 11;
}

message Decimal {
  int64 units = 1;
  int32 nanos = 2;
}
