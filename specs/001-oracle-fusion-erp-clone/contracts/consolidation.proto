// Consolidation & Multi-Currency Service Contract
// Version: 1.0.0

syntax = "proto3";

package fusion.consolidation.v1;

import "common.proto";

// === Legal Entity Management ===

service LegalEntityService {
  rpc CreateLegalEntity(CreateLegalEntityRequest) returns (LegalEntity);
  rpc GetLegalEntity(GetLegalEntityRequest) returns (LegalEntity);
  rpc ListLegalEntities(ListLegalEntitiesRequest) returns (ListLegalEntitiesResponse);
  rpc UpdateLegalEntity(UpdateLegalEntityRequest) returns (LegalEntity);
}

message LegalEntity {
  string id = 1;
  string entity_code = 2;
  string name = 3;
  string base_currency = 4;
  string parent_entity_id = 5;
  int32 fiscal_year_start_month = 6;
  bool is_active = 7;
  fusion.common.v1.AuditInfo audit_info = 8;
}

message CreateLegalEntityRequest {
  string entity_code = 1;
  string name = 2;
  string base_currency = 3;
  string parent_entity_id = 4;
  int32 fiscal_year_start_month = 5;
}

message GetLegalEntityRequest {
  string id = 1;
}

message ListLegalEntitiesRequest {
  fusion.common.v1.PaginationRequest pagination = 1;
  bool active_only = 2;
}

message ListLegalEntitiesResponse {
  repeated LegalEntity entities = 1;
  fusion.common.v1.PaginationResponse pagination = 2;
}

message UpdateLegalEntityRequest {
  string id = 1;
  string name = 2;
  string base_currency = 3;
  int32 fiscal_year_start_month = 4;
}

// === Exchange Rates ===

service ExchangeRateService {
  rpc CreateExchangeRate(CreateExchangeRateRequest) returns (ExchangeRate);
  rpc GetExchangeRate(GetExchangeRateRequest) returns (ExchangeRate);
  rpc ListExchangeRates(ListExchangeRatesRequest) returns (ListExchangeRatesResponse);
  rpc GetCurrentRate(GetCurrentRateRequest) returns (ExchangeRate);
}

message ExchangeRate {
  string id = 1;
  string from_currency = 2;
  string to_currency = 3;
  string rate = 4; // Decimal as string
  string effective_date = 5;
  string source = 6;
}

message CreateExchangeRateRequest {
  string from_currency = 1;
  string to_currency = 2;
  string rate = 3;
  string effective_date = 4;
  string source = 5;
}

message GetExchangeRateRequest {
  string id = 1;
}

message ListExchangeRatesRequest {
  fusion.common.v1.PaginationRequest pagination = 1;
  string from_currency = 2;
  string to_currency = 3;
}

message ListExchangeRatesResponse {
  repeated ExchangeRate rates = 1;
  fusion.common.v1.PaginationResponse pagination = 2;
}

message GetCurrentRateRequest {
  string from_currency = 1;
  string to_currency = 2;
  string as_of_date = 3;
}

// === Currency Revaluation ===

service RevaluationService {
  rpc RunRevaluation(RunRevaluationRequest) returns (RevaluationResult);
}

message RunRevaluationRequest {
  string legal_entity_id = 1;
  int32 period_year = 2;
  int32 period_number = 3;
  string revaluation_date = 4;
}

message RevaluationResult {
  string id = 1;
  string legal_entity_id = 2;
  int32 period_year = 3;
  int32 period_number = 4;
  repeated RevaluationEntry entries = 5;
  fusion.common.v1.Money total_unrealized_gain = 6;
  fusion.common.v1.Money total_unrealized_loss = 7;
}

message RevaluationEntry {
  string account_id = 1;
  string account_code = 2;
  string currency = 3;
  fusion.common.v1.Money original_amount = 4;
  fusion.common.v1.Money revalued_amount = 5;
  fusion.common.v1.Money unrealized_gain_loss = 6;
  string gl_journal_entry_id = 7;
}

// === Consolidation ===

service ConsolidationService {
  rpc RunConsolidation(RunConsolidationRequest) returns (ConsolidationResult);
  rpc GetConsolidationStatus(GetConsolidationStatusRequest) returns (ConsolidationResult);
}

message RunConsolidationRequest {
  int32 period_year = 1;
  int32 period_number = 2;
  string reporting_currency = 3;
  repeated string entity_ids = 4; // Optional: specific entities; empty = all
}

message ConsolidationResult {
  string id = 1;
  int32 period_year = 2;
  int32 period_number = 3;
  string reporting_currency = 4;
  ConsolidationStatus status = 5;
  repeated ConsolidationEntry entries = 6;
  string started_at = 7;
  string completed_at = 8;
  string initiated_by = 9;
}

enum ConsolidationStatus {
  CONSOLIDATION_STATUS_UNSPECIFIED = 0;
  CONSOLIDATION_STATUS_RUNNING = 1;
  CONSOLIDATION_STATUS_COMPLETED = 2;
  CONSOLIDATION_STATUS_FAILED = 3;
}

message ConsolidationEntry {
  string entity_id = 1;
  string entity_name = 2;
  string entity_currency = 3;
  fusion.common.v1.Money entity_total_assets = 4;
  fusion.common.v1.Money converted_total_assets = 5;
  string exchange_rate_used = 6;
  repeated EliminationEntry eliminations = 7;
}

message EliminationEntry {
  string description = 1;
  fusion.common.v1.Money debit = 2;
  fusion.common.v1.Money credit = 3;
  string from_entity_id = 4;
  string to_entity_id = 5;
}

message GetConsolidationStatusRequest {
  string id = 1;
}
