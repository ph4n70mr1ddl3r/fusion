// Identity & Access Management Service Contract
// Version: 1.0.0

syntax = "proto3";

package fusion.identity.v1;

import "common.proto";

// === User Management ===

service UserService {
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc DeactivateUser(DeactivateUserRequest) returns (User);
}

message User {
  string id = 1;
  string email = 2;
  string full_name = 3;
  bool is_active = 4;
  repeated Role roles = 5;
  string last_login_at = 6;
  fusion.common.v1.AuditInfo audit_info = 7;
}

message CreateUserRequest {
  string email = 1;
  string password = 2; // Plain text; service hashes with Argon2
  string full_name = 3;
  repeated string role_ids = 4;
}

message GetUserRequest {
  string id = 1;
}

message ListUsersRequest {
  fusion.common.v1.PaginationRequest pagination = 1;
  bool active_only = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  fusion.common.v1.PaginationResponse pagination = 2;
}

message UpdateUserRequest {
  string id = 1;
  string full_name = 2;
  string email = 3;
}

message DeactivateUserRequest {
  string id = 1;
}

// === Role Management ===

service RoleService {
  rpc CreateRole(CreateRoleRequest) returns (Role);
  rpc GetRole(GetRoleRequest) returns (Role);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (Role);
  rpc AssignRole(AssignRoleRequest) returns (fusion.common.v1.Empty);
  rpc RevokeRole(RevokeRoleRequest) returns (fusion.common.v1.Empty);
}

message Role {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated Permission permissions = 4;
  fusion.common.v1.AuditInfo audit_info = 5;
}

message Permission {
  string module = 1;  // "gl", "ap", "ar", "procurement", "reporting", etc.
  string action = 2;  // "create", "read", "update", "delete", "post", "approve"
  string scope = 3;   // "own", "department", "all"
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
  repeated Permission permissions = 3;
}

message GetRoleRequest {
  string id = 1;
}

message ListRolesRequest {
  fusion.common.v1.PaginationRequest pagination = 1;
}

message ListRolesResponse {
  repeated Role roles = 1;
  fusion.common.v1.PaginationResponse pagination = 2;
}

message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated Permission permissions = 4;
}

message AssignRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message RevokeRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

// === Authentication ===

service AuthenticationService {
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (fusion.common.v1.Empty);
}

message AuthenticateRequest {
  string email = 1;
  string password = 2;
}

message AuthenticateResponse {
  string access_token = 1;  // JWT, 15-minute expiry
  string refresh_token = 2; // 7-day expiry
  User user = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutRequest {
  string refresh_token = 1; // To revoke the refresh token
}

// === Audit Log ===

service AuditLogService {
  rpc GetAuditLog(GetAuditLogRequest) returns (AuditLogEntry);
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
}

message AuditLogEntry {
  string id = 1;
  string user_id = 2;
  string action = 3;    // CREATE, READ, UPDATE, DELETE, LOGIN, LOGOUT
  string module = 4;
  string entity_type = 5;
  string entity_id = 6;
  string changes = 7;   // JSON: { "field": "status", "old": "DRAFT", "new": "POSTED" }
  string ip_address = 8;
  string timestamp = 9;
}

message GetAuditLogRequest {
  string id = 1;
}

message ListAuditLogsRequest {
  fusion.common.v1.PaginationRequest pagination = 1;
  string user_id = 2;
  string module = 3;
  string entity_type = 4;
  string entity_id = 5;
  string date_from = 6;
  string date_to = 7;
}

message ListAuditLogsResponse {
  repeated AuditLogEntry entries = 1;
  fusion.common.v1.PaginationResponse pagination = 2;
}
