syntax = "proto3";
package fusion.identity.v1;
option go_package = "github.com/fusion/identity/v1";

// Identity Service — authentication, user management, tenant provisioning
// Consumed by: API gateway (REST→gRPC), all services (token validation via JWKS)

service IdentityService {
  // Authentication
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc RequestPasswordReset(PasswordResetRequest) returns (PasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);

  // User management
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc DeactivateUser(DeactivateUserRequest) returns (User);

  // Tenant provisioning (admin only)
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  rpc SuspendTenant(SuspendTenantRequest) returns (Tenant);

  // JWKS (called by other services at startup)
  rpc GetJwks(GetJwksRequest) returns (JwksResponse);
}

// --- Messages ---

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at_unix = 3;
  User user = 4;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at_unix = 3;
}

message PasswordResetRequest {
  string email = 1;
}

message PasswordResetResponse {
  // Always returns OK to prevent email enumeration
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {}

message CreateUserRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
  string tenant_id = 4;   // resolved from auth context for non-admin
  optional string department_id = 5;
  repeated string role_ids = 6;
}

message GetUserRequest {
  string id = 1;
}

message ListUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional bool is_active = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateUserRequest {
  string id = 1;
  optional string display_name = 2;
  optional string department_id = 3;
  optional bool is_active = 4;
  repeated string role_ids = 5;
}

message DeactivateUserRequest {
  string id = 1;
}

message CreateTenantRequest {
  string name = 1;
  string slug = 2;
  string plan = 3;
}

message GetTenantRequest {
  string id = 1;
}

message SuspendTenantRequest {
  string id = 1;
  string reason = 2;
}

message GetJwksRequest {}

message JwksResponse {
  string jwks_json = 1;  // RFC 7517 JSON
}

// --- Domain models ---

message User {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string display_name = 4;
  optional string department_id = 5;
  bool is_active = 6;
  repeated Role roles = 7;
  int64 last_login_at_unix = 8;
  int64 created_at_unix = 9;
  int64 updated_at_unix = 10;
}

message Tenant {
  string id = 1;
  string name = 2;
  string slug = 3;
  string status = 4;
  string plan = 5;
  int64 created_at_unix = 6;
}

message Role {
  string id = 1;
  string name = 2;
  repeated string permissions = 3;
  string data_scope = 4;  // OWN, DEPARTMENT, ALL
}
