syntax = "proto3";
package fusion.ar.v1;
option go_package = "github.com/fusion/ar/v1";

// Accounts Receivable Service — customers, invoices, receipts
// Consumed by: API gateway, GL service, reporting service

service ArService {
  // Customers
  rpc CreateCustomer(CreateCustomerRequest) returns (Customer);
  rpc GetCustomer(GetCustomerRequest) returns (Customer);
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  rpc UpdateCustomer(UpdateCustomerRequest) returns (Customer);

  // Invoices
  rpc CreateInvoice(ArCreateInvoiceRequest) returns (ArInvoice);
  rpc GetInvoice(ArGetInvoiceRequest) returns (ArInvoice);
  rpc ListInvoices(ArListInvoicesRequest) returns (ArListInvoicesResponse);
  rpc UpdateInvoice(ArUpdateInvoiceRequest) returns (ArInvoice);
  rpc PostInvoice(ArPostInvoiceRequest) returns (ArInvoice);
  rpc VoidInvoice(VoidInvoiceRequest) returns (ArInvoice);

  // Receipts
  rpc CreateReceipt(CreateReceiptRequest) returns (Receipt);
  rpc GetReceipt(GetReceiptRequest) returns (Receipt);
  rpc ListReceipts(ListReceiptsRequest) returns (ListReceiptsResponse);
  rpc ApplyReceipt(ApplyReceiptRequest) returns (Receipt);
  rpc UnapplyReceipt(UnapplyReceiptRequest) returns (Receipt);

  // Credit check
  rpc CheckCustomerCredit(CheckCustomerCreditRequest) returns (CreditCheckResponse);

  // Reports
  rpc GetAgingReport(ArAgingReportRequest) returns (ArAgingReportResponse);

  // Health
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Ready(ReadyRequest) returns (ReadyResponse);
}

// --- Messages ---

message CreateCustomerRequest {
  string customer_code = 1;
  string name = 2;
  optional string address_line1 = 3;
  optional string city = 4;
  optional string state = 5;
  optional string postal_code = 6;
  optional string country = 7;
  int32 payment_terms_days = 8;
  optional Decimal credit_limit = 9;
  optional string tax_id = 10;
}

message GetCustomerRequest { string id = 1; }

message ListCustomersRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string status = 3;
  optional string search = 4;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateCustomerRequest {
  string id = 1;
  optional string name = 2;
  optional int32 payment_terms_days = 3;
  optional Decimal credit_limit = 4;
  int32 version = 5;
}

message ArCreateInvoiceRequest {
  string customer_id = 1;
  string invoice_date = 2;
  string due_date = 3;
  optional string description = 4;
  string currency = 5;
  repeated ArInvoiceLine lines = 6;
}

message ArGetInvoiceRequest { string id = 1; }

message ArListInvoicesRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string status = 3;
  optional string customer_id = 4;
  optional string date_from = 5;
  optional string date_to = 6;
}

message ArListInvoicesResponse {
  repeated ArInvoice invoices = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message ArUpdateInvoiceRequest {
  string id = 1;
  optional string description = 2;
  repeated ArInvoiceLine lines = 3;
  int32 version = 4;
}

message ArPostInvoiceRequest {
  string id = 1;
  int32 version = 2;
}

message VoidInvoiceRequest {
  string id = 1;
  string reason = 2;
}

message CreateReceiptRequest {
  string customer_id = 1;
  string receipt_date = 2;
  Decimal amount = 3;
  string currency = 4;
  string payment_method = 5;
  optional string reference = 6;
  repeated ReceiptInvoiceAllocation allocations = 7;
}

message ReceiptInvoiceAllocation {
  string invoice_id = 1;
  Decimal applied_amount = 2;
}

message GetReceiptRequest { string id = 1; }

message ListReceiptsRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string status = 3;
  optional string customer_id = 4;
}

message ListReceiptsResponse {
  repeated Receipt receipts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message ApplyReceiptRequest {
  string receipt_id = 1;
  repeated ReceiptInvoiceAllocation allocations = 2;
  int32 version = 3;
}

message UnapplyReceiptRequest {
  string receipt_id = 1;
  string invoice_id = 2;
  Decimal unapplied_amount = 3;
  int32 version = 4;
}

message CheckCustomerCreditRequest {
  string customer_id = 1;
  optional Decimal additional_amount = 2;
}

message CreditCheckResponse {
  Decimal credit_limit = 1;
  Decimal outstanding_balance = 2;
  Decimal available_credit = 3;
  bool is_on_hold = 4;
}

message ArAgingReportRequest {
  optional string as_of_date = 1;
}

message ArAgingReportResponse {
  repeated ArAgingLine lines = 1;
  Decimal total_current = 2;
  Decimal total_30_days = 3;
  Decimal total_60_days = 4;
  Decimal total_90_plus = 5;
  Decimal grand_total = 6;
}

message ArAgingLine {
  string customer_id = 1;
  string customer_name = 2;
  Decimal current = 3;
  Decimal days_30 = 4;
  Decimal days_60 = 5;
  Decimal days_90_plus = 6;
  Decimal total = 7;
}

message HealthRequest {}
message HealthResponse { string status = 1; }
message ReadyRequest {}
message ReadyResponse { bool ready = 1; repeated string checks = 2; }

// --- Domain models ---

message Customer {
  string id = 1;
  string customer_code = 2;
  string name = 3;
  int32 payment_terms_days = 4;
  Decimal credit_limit = 5;
  string status = 6;
  int32 version = 7;
  int64 created_at_unix = 8;
  int64 updated_at_unix = 9;
}

message ArInvoice {
  string id = 1;
  string invoice_number = 2;
  string customer_id = 3;
  string invoice_date = 4;
  string due_date = 5;
  optional string description = 6;
  Decimal subtotal = 7;
  Decimal tax_amount = 8;
  Decimal total_amount = 9;
  string currency = 10;
  string status = 11;
  string correlation_id = 12;
  optional string posted_journal_entry_id = 13;
  repeated ArInvoiceLine lines = 14;
  int32 version = 15;
  int64 created_at_unix = 16;
  int64 updated_at_unix = 17;
}

message ArInvoiceLine {
  string id = 1;
  int32 line_number = 2;
  string description = 3;
  Decimal quantity = 4;
  Decimal unit_price = 5;
  Decimal line_amount = 6;
  optional string tax_code_id = 7;
  Decimal tax_amount = 8;
}

message Receipt {
  string id = 1;
  string receipt_number = 2;
  string customer_id = 3;
  string receipt_date = 4;
  Decimal amount = 5;
  Decimal unapplied_amount = 6;
  string currency = 7;
  string payment_method = 8;
  optional string reference = 9;
  string status = 10;
  string correlation_id = 11;
  optional string posted_journal_entry_id = 12;
  int32 version = 13;
  int64 created_at_unix = 14;
  int64 updated_at_unix = 15;
}

message Decimal {
  int64 units = 1;
  int32 nanos = 2;
}
