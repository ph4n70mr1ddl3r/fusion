syntax = "proto3";
package fusion.workflow.v1;
option go_package = "github.com/fusion/workflow/v1";

// Workflow Service — approval workflows, approval instances, escalation
// Consumed by: API gateway, all transactional services (GL, AP, AR, Procurement, Budget)

service WorkflowService {
  // Workflow configuration
  rpc CreateApprovalWorkflow(CreateApprovalWorkflowRequest) returns (ApprovalWorkflow);
  rpc GetApprovalWorkflow(GetApprovalWorkflowRequest) returns (ApprovalWorkflow);
  rpc ListApprovalWorkflows(ListApprovalWorkflowsRequest) returns (ListApprovalWorkflowsResponse);
  rpc UpdateApprovalWorkflow(UpdateApprovalWorkflowRequest) returns (ApprovalWorkflow);
  rpc DeactivateApprovalWorkflow(DeactivateApprovalWorkflowRequest) returns (ApprovalWorkflow);

  // Workflow execution
  rpc SubmitForApproval(SubmitForApprovalRequest) returns (ApprovalInstance);
  rpc GetApprovalInstance(GetApprovalInstanceRequest) returns (ApprovalInstance);
  rpc ListApprovalInstances(ListApprovalInstancesRequest) returns (ListApprovalInstancesResponse);
  rpc ApproveStep(ApproveStepRequest) returns (ApprovalInstance);
  rpc RejectStep(RejectStepRequest) returns (ApprovalInstance);

  // Delegation
  rpc SetDelegation(SetDelegationRequest) returns (SetDelegationResponse);

  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Ready(ReadyRequest) returns (ReadyResponse);
}

// --- Messages ---

message CreateApprovalWorkflowRequest {
  string name = 1;
  string document_type = 2;
  string trigger_conditions_json = 3;
  repeated WorkflowStep steps = 4;
  int32 escalation_timeout_minutes = 5;
}

message GetApprovalWorkflowRequest { string id = 1; }

message ListApprovalWorkflowsRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string document_type = 3;
  optional bool is_active = 4;
}

message ListApprovalWorkflowsResponse {
  repeated ApprovalWorkflow workflows = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateApprovalWorkflowRequest {
  string id = 1;
  optional string name = 2;
  optional string trigger_conditions_json = 3;
  repeated WorkflowStep steps = 4;
  optional int32 escalation_timeout_minutes = 5;
  int32 version = 6;
}

message DeactivateApprovalWorkflowRequest { string id = 1; }

message SubmitForApprovalRequest {
  string document_type = 1;
  string document_id = 2;
  Decimal document_amount = 3;
  optional string department_id = 4;
}

message GetApprovalInstanceRequest { string id = 1; }

message ListApprovalInstancesRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string status = 3;
  optional string document_type = 4;
  optional string assigned_to_user_id = 5;
}

message ListApprovalInstancesResponse {
  repeated ApprovalInstance instances = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message ApproveStepRequest {
  string instance_id = 1;
  optional string comments = 2;
}

message RejectStepRequest {
  string instance_id = 1;
  string reason = 2;
}

message SetDelegationRequest {
  string workflow_step_id = 1;
  string delegate_to_user_id = 2;
}

message SetDelegationResponse {}

message HealthRequest {}
message HealthResponse { string status = 1; }
message ReadyRequest {}
message ReadyResponse { bool ready = 1; repeated string checks = 2; }

// --- Domain models ---

message WorkflowStep {
  int32 step_number = 1;
  string approver_type = 2;  // specific_user, role, department_manager
  string approver_ref = 3;   // user ID, role ID, or department ID
  optional string delegate_to_user_id = 4;
}

message ApprovalWorkflow {
  string id = 1;
  string name = 2;
  string document_type = 3;
  string trigger_conditions_json = 4;
  repeated WorkflowStepInfo steps = 5;
  int32 escalation_timeout_minutes = 6;
  bool is_active = 7;
  int32 version = 8;
  int64 created_at_unix = 9;
  int64 updated_at_unix = 10;
}

message WorkflowStepInfo {
  string id = 1;
  int32 step_number = 2;
  string approver_type = 3;
  string approver_ref = 4;
  optional string delegate_to_user_id = 5;
}

message ApprovalInstance {
  string id = 1;
  string workflow_id = 2;
  string document_type = 3;
  string document_id = 4;
  string submitted_by = 5;
  int32 current_step = 6;
  string status = 7;
  repeated ApprovalStepStatus step_statuses = 8;
  int64 created_at_unix = 9;
  int64 updated_at_unix = 10;
}

message ApprovalStepStatus {
  string id = 1;
  int32 step_number = 2;
  string assigned_to_user_id = 3;
  optional string action = 4;
  optional int64 acted_at_unix = 5;
  optional string comments = 6;
  bool is_escalated = 7;
  optional string escalated_to_user_id = 8;
}

message Decimal {
  int64 units = 1;
  int32 nanos = 2;
}
