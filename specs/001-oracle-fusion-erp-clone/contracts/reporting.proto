syntax = "proto3";
package fusion.reporting.v1;
option go_package = "github.com/fusion/reporting/v1";

// Reporting Service — custom reports, saved reports, export
// Consumed by: API gateway. Calls: GL, AP, AR, Budget services

service ReportingService {
  // Saved reports
  rpc CreateSavedReport(CreateSavedReportRequest) returns (SavedReport);
  rpc GetSavedReport(GetSavedReportRequest) returns (SavedReport);
  rpc ListSavedReports(ListSavedReportsRequest) returns (ListSavedReportsResponse);
  rpc DeleteSavedReport(DeleteSavedReportRequest) returns (DeleteSavedReportResponse);

  // Report execution
  rpc ExecuteReport(ExecuteReportRequest) returns (ExecuteReportResponse);
  rpc ExecuteStandardReport(ExecuteStandardReportRequest) returns (ExecuteReportResponse);

  // Export
  rpc ExportReport(ExportReportRequest) returns (ExportReportResponse);

  // Dashboard KPIs
  rpc GetDashboardKpis(GetDashboardKpisRequest) returns (DashboardKpisResponse);

  // Health
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Ready(ReadyRequest) returns (ReadyResponse);
}

// --- Messages ---

message CreateSavedReportRequest {
  string name = 1;
  optional string description = 2;
  string report_type = 3;     // "standard" or "custom"
  repeated string source_services = 4;
  string field_selections_json = 5;
  string filters_json = 6;
  optional string groupings_json = 7;
  optional string aggregation_functions_json = 8;
}

message GetSavedReportRequest { string id = 1; }

message ListSavedReportsRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string report_type = 3;
}

message ListSavedReportsResponse {
  repeated SavedReport reports = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message DeleteSavedReportRequest { string id = 1; }
message DeleteSavedReportResponse {}

message ExecuteReportRequest {
  string saved_report_id = 1;
  optional string override_filters_json = 2;
}

message ExecuteStandardReportRequest {
  string report_type = 1;  // "income_statement", "balance_sheet", "cash_flow", "trial_balance"
  string period_id = 2;
  optional string comparison_period_id = 3;
  optional string as_of_date = 4;
}

message ExecuteReportResponse {
  repeated ReportColumn columns = 1;
  repeated ReportRow rows = 2;
  repeated string warnings = 3;  // e.g., partial data warnings
  int64 executed_at_unix = 4;
}

message ReportColumn {
  string name = 1;
  string data_type = 2;  // string, decimal, date
  string source_service = 3;
}

message ReportRow {
  repeated ReportCell cells = 1;
}

message ReportCell {
  string column_name = 1;
  oneof value {
    string string_value = 2;
    string decimal_value = 3;  // string to preserve precision
    int64 date_value_unix = 4;
  }
}

message ExportReportRequest {
  string saved_report_id = 1;
  string format = 2;         // "pdf" or "xlsx"
  optional string override_filters_json = 3;
}

message ExportReportResponse {
  bytes data = 1;
  string content_type = 2;   // "application/pdf" or "application/vnd.openxmlformats..."
  string filename = 3;
}

message GetDashboardKpisRequest {}

message DashboardKpisResponse {
  Decimal total_revenue = 1;
  Decimal total_expenses = 2;
  Decimal cash_position = 3;
  Decimal receivables_outstanding = 4;
  Decimal payables_outstanding = 5;
  Decimal net_income = 6;
  repeated MonthlyTrend revenue_trend = 7;
  repeated MonthlyTrend expense_trend = 8;
  int64 as_of_unix = 9;
}

message MonthlyTrend {
  string month = 1;  // "YYYY-MM"
  Decimal amount = 2;
}

message HealthRequest {}
message HealthResponse { string status = 1; }
message ReadyRequest {}
message ReadyResponse { bool ready = 1; repeated string checks = 2; }

// --- Domain models ---

message SavedReport {
  string id = 1;
  string name = 2;
  optional string description = 3;
  string report_type = 4;
  repeated string source_services = 5;
  string field_selections_json = 6;
  string filters_json = 7;
  optional string groupings_json = 8;
  optional string aggregation_functions_json = 9;
  int64 created_at_unix = 10;
  int64 updated_at_unix = 11;
}

message Decimal {
  int64 units = 1;
  int32 nanos = 2;
}
